<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- collects console output for the log panel: load before all other scripts -->
  <script src="ui/log-panel.js"></script>
  <title>AlignFix</title>
  <link rel="stylesheet" href="ui/styles/main.css" />

  <link rel="icon" type="image/x-icon" href="ui/img/favicon.ico" />

  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- DataTables Scroller -->
  <link rel="stylesheet" href="https://cdn.datatables.net/scroller/2.4.3/css/scroller.dataTables.min.css">

</head>
<body>
  <div class="d-flex">
    <nav class="sidebar d-flex flex-column flex-shrink-0 position-fixed">

        <div class="pt-3 pb-2 px-4 top">
          <a class="navbar-brand d-flex align-items-center" href="#home">
            <h2 class="fw-bold mb-2">
              <i class="fas fa-align-center alignfix-icon me-3"></i>
              AlignFix
            </h2>
          </a>
        </div>

        <div id="sidebar-content" class="p-4"></div>
    </nav>

    <main class="main-content">
      <header class="app-header sticky-top">
        <nav class="navbar navbar-expand py-2" aria-label="Main">
          <ul class="navbar-nav align-items-center">
              <li id="project-name-nav" class="nav-item d-none">
                  <span class="navbar-text project-name me-2" id="project-name-label"></span>
              </li>
              <li id="project" class="nav-item" style="display: none;">
                  <a class="nav-link" href="#project">Phrases</a>
              </li>
              <li id="scores" class="nav-item" style="display: none;">
                  <a class="nav-link" href="#scores">Scores</a>
              </li>
              <li id="history" class="nav-item" style="display: none;">
                  <a class="nav-link" href="#history">History</a>
              </li>
              <li id="stats" class="nav-item" style="display: none;">
                  <a class="nav-link" href="#stats">Stats</a>
              </li>
          </ul>
          <ul class="navbar-nav ms-auto">
              <li id="home" class="nav-item">
                  <a class="nav-link" href="#home"><i class="fas fa-folder-open me-1"></i>Projects</a>
              </li>
              <li id="about" class="nav-item">
                  <a class="nav-link" href="#about"><i class="fas fa-circle-info me-1"></i>About</a>
              </li>
          </ul>
        </nav>

        <!-- Status of the current operation; click to show the logs -->
        <div id="status-bar" class="status-bar" data-state="idle">
          <button id="status-toggle" class="status-main" type="button" aria-expanded="false" aria-controls="log-panel"
                  title="Show or hide the logs">
            <span class="status-icon" aria-hidden="true">
              <i class="fas fa-circle-check state-idle state-done"></i>
              <span class="spinner-border spinner-border-sm state-running"></span>
              <i class="fas fa-circle-exclamation state-failed"></i>
            </span>
            <span class="status-text">
              <span id="status-title" class="status-title">Starting…</span>
              <span id="status-detail" class="status-detail"></span>
            </span>
            <span id="status-time" class="status-time"></span>
            <span id="status-progress" class="status-progress" role="progressbar" aria-label="Progress"
                  aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="status-fill" class="status-fill"></span>
            </span>
            <span id="status-percent" class="status-percent"></span>
            <span class="status-logs">
              <span id="log-warn-count" class="badge rounded-pill text-bg-warning" hidden>0</span>
              <span id="log-error-count" class="badge rounded-pill text-bg-danger" hidden>0</span>
              <span class="status-logs-label">Logs</span>
              <i class="fas fa-chevron-down status-chevron"></i>
            </span>
          </button>
          <div id="log-panel" class="log-panel" hidden>
            <div class="log-toolbar">
              <label class="visually-hidden" for="log-level">Show</label>
              <select id="log-level" class="form-select form-select-sm w-auto">
                <option value="debug">Everything (with details)</option>
                <option value="info" selected>Messages</option>
                <option value="warn">Warnings and errors</option>
                <option value="error">Errors only</option>
              </select>
              <div class="ms-auto btn-group btn-group-sm" role="group" aria-label="Log actions">
                <button id="log-copy" class="btn btn-outline-secondary" type="button" title="Copy the shown messages">
                  <i class="fas fa-copy"></i>
                </button>
                <button id="log-download" class="btn btn-outline-secondary" type="button" title="Download the complete log">
                  <i class="fas fa-download"></i>
                </button>
                <button id="log-clear" class="btn btn-outline-secondary" type="button" title="Clear the log">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
            <div id="log-scroll" class="log-scroll">
              <div id="log-empty" class="text-muted small p-2" hidden>No messages.</div>
              <div id="log-messages" class="log-messages" role="log" aria-live="off"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="page">
        <div id="app"></div>
      </div>
    </main>

  </div>
  <!-- Load Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>


  <!-- DataTables dependencies -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.5/css/dataTables.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.5/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/scroller/2.4.3/js/dataTables.scroller.min.js"></script>
  <script src="https://cdn.datatables.net/scroller/2.4.3/js/scroller.dataTables.js"></script>


  <!-- Fast Align -->
  <script type="module" src="./main.js"></script>

  <!-- Dynamic WASM Module Loader - detects hardware and loads appropriate versions -->
  <script src="backend/module-loader.js"></script>

  <!-- 
    WASM modules are now loaded dynamically based on hardware:
    - Detects available CPU cores and memory
    - Loads appropriate version: _p1 (1 core), _p4 (4 cores), _p8 (8 cores), or _p16 (16 cores)
    - Use window.WasmModuleLoader to load modules programmatically
  -->

  <!-- for histogram -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 

  <!-- to create zip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </body>
</html>
